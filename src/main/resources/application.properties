# Un unico JAR con tutte le dipendenze: target/<nome>-runner.jar
quarkus.package.jar.type=uber-jar

# Swagger UI su /q/swagger-ui, anche fuori dalla dev mode (in un'app vera di solito no)
quarkus.swagger-ui.always-include=true

# Host e porta di ascolto
quarkus.http.host=0.0.0.0
quarkus.http.port=${PORT:8080}

# Variabili applicative per messaggio e versione con default
app.message=${MESSAGE:Ciao dalla mia app!}
app.version=${APP_VERSION:1.0}

# /crash spegne davvero l'app, tranne durante i test
app.crash.exit=true
%test.app.crash.exit=false
