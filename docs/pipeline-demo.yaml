# SOLO DIMOSTRAZIONE (slide "Come lo fa una pipeline vera").
# Il file è fuori da .github/workflows, quindi GitHub NON lo esegue.
# Mostra come i comandi dei Lab 3 e 4 vengono automatizzati in azienda.
name: build-image
on:
  push:
    branches: [main]
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: ./mvnw -B package
      - run: docker build -t $IMG:${{ github.sha }} .
      - run: echo "$PASS" | docker login $REG -u $USER --password-stdin
      - run: docker push $IMG:${{ github.sha }}
